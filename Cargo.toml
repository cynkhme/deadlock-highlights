[package]
name = "dlhl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Highlight windows and clips for Deadlock VODs from the game clock and deadlock-api.com match data"
license = "MIT"
publish = false
# An allowlist, so local data beside the sources is never packaged.
include = ["/src/**", "/tests/**", "/templates/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Casts here convert bounded seconds, indices and counts; these lints would only add noise.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Match ids are not grouped by thousands, so separators would not help.
unreadable_literal = "allow"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
deadlock-api = { version = "0.1", features = ["fs-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
bytes = "1"
http = "1"
